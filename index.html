<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de reseñas</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #eef6ff;
        --card: rgba(255, 255, 255, 0.96);
        --text: #17324d;
        --muted: #5f738a;
        --border: #c7dbf2;
        --accent: #1f6feb;
        --accent-strong: #1557c0;
        --accent-soft: #dcedff;
        --shadow: 0 18px 40px rgba(31, 111, 235, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            circle at top left,
            rgba(31, 111, 235, 0.18),
            transparent 28%
          ),
          radial-gradient(
            circle at bottom right,
            rgba(125, 211, 252, 0.4),
            transparent 30%
          ),
          linear-gradient(135deg, #f9fcff 0%, #e8f2ff 100%);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 32px 18px 26px;
      }

      .page {
        width: min(1200px, 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }

      .card {
        width: min(100%, 500px);
        background: var(--card);
        border: 1px solid rgba(199, 219, 242, 0.9);
        border-radius: 18px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
        padding: 18px;
        margin-top: 8px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.3rem, 3vw, 1.8rem);
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 16px;
        color: var(--muted);
        line-height: 1.5;
        font-size: 0.95rem;
      }

      form {
        display: grid;
        gap: 12px;
      }

      .grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .field {
        display: grid;
        gap: 8px;
      }

      label {
        font-weight: 700;
        font-size: 0.9rem;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 11px 12px;
        font: inherit;
        color: var(--text);
        background: #fff;
        outline: none;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }

      input:focus,
      textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(31, 111, 235, 0.12);
      }

      textarea {
        min-height: 110px;
        resize: vertical;
      }

      .actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      button {
        border: 0;
        border-radius: 12px;
        padding: 10px 14px;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(
          135deg,
          var(--accent),
          var(--accent-strong)
        );
        cursor: pointer;
        box-shadow: 0 10px 20px rgba(31, 111, 235, 0.2);
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          opacity 0.15s ease;
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 12px 24px rgba(31, 111, 235, 0.24);
      }

      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      .status {
        min-height: 1.25rem;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .hint {
        margin-top: 8px;
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--accent-soft);
        color: #164b9d;
        font-size: 0.9rem;
        line-height: 1.45;
        border: 1px solid rgba(31, 111, 235, 0.12);
      }

      .reviews-section {
        width: 100%;
        align-self: stretch;
        padding: 2px 0 0;
      }

      .reviews-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .reviews-title {
        margin: 0;
        font-size: 1.05rem;
      }

      .reviews-grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      }

      .review-card {
        background: linear-gradient(180deg, #ffffff 0%, #f7fbff 100%);
        border: 1px solid rgba(199, 219, 242, 0.9);
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 12px 28px rgba(31, 111, 235, 0.1);
        min-height: 150px;
      }

      .review-top {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: flex-start;
        margin-bottom: 8px;
      }

      .review-product {
        margin: 0;
        font-size: 1rem;
        font-weight: 700;
        color: var(--accent-strong);
      }

      .review-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .review-badge {
        display: inline-flex;
        align-items: center;
        padding: 4px 8px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: #164b9d;
        font-size: 0.78rem;
        font-weight: 700;
      }

      .review-text {
        margin: 0;
        color: var(--text);
        line-height: 1.45;
        font-size: 0.94rem;
        white-space: pre-wrap;
      }

      .empty-state {
        margin: 0;
        padding: 16px;
        border-radius: 16px;
        background: #f7fbff;
        border: 1px dashed rgba(31, 111, 235, 0.2);
        color: var(--muted);
        font-size: 0.92rem;
        grid-column: 1 / -1;
      }

      @media (max-width: 640px) {
        body {
          padding-top: 18px;
        }

        .page {
          align-items: stretch;
          gap: 18px;
        }

        .card {
          width: min(100%, 100%);
          margin-top: 0;
          padding: 16px;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .reviews-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <main class="card">
        <h1>Formulario de reseñas</h1>
        <p>
          Completa los datos y el formulario enviará la información a tu Google
          Sheet.
        </p>

        <form id="reviewForm">
          <div class="grid">
            <div class="field">
              <label for="producto">Producto</label>
              <input
                id="producto"
                name="producto"
                type="text"
                placeholder="Ej. Audífonos inalámbricos"
                required
              />
            </div>

            <div class="field">
              <label for="cliente">Cliente</label>
              <input
                id="cliente"
                name="cliente"
                type="text"
                placeholder="Ej. Ana Pérez"
                required
              />
            </div>
          </div>

          <div class="field">
            <label for="reseña">Reseña</label>
            <textarea
              id="reseña"
              name="reseña"
              placeholder="Escribe tu opinion..."
              required
            ></textarea>
          </div>

          <div class="grid">
            <div class="field">
              <label for="fecha">Fecha</label>
              <input id="fecha" name="fecha" type="date" required />
            </div>

            <div class="field">
              <label>&nbsp;</label>
              <div class="actions">
                <button id="submitBtn" type="submit">Enviar al Sheet</button>
                <div id="status" class="status"></div>
              </div>
            </div>
          </div>
        </form>
      </main>

      <section class="reviews-section" aria-labelledby="reviewsTitle">
        <div class="reviews-header">
          <h2 id="reviewsTitle" class="reviews-title">Reseñas destacadas</h2>
          <div id="reviewsStatus" class="status">Cargando...</div>
        </div>
        <div id="reviewsGrid" class="reviews-grid"></div>
      </section>
    </div>

    <script>
      const SHEET_ENDPOINT =
        "https://script.google.com/macros/s/AKfycbwMlrqC8Y5OPhgqx3MIjUScCrJbivjAqb_cjcLRX-hOIemZwxCKtpwo5JzP3Bi3oHGy4Q/exec";
      const REVIEWS_ENDPOINT = SHEET_ENDPOINT;
      const form = document.getElementById("reviewForm");
      const status = document.getElementById("status");
      const submitBtn = document.getElementById("submitBtn");
      const fechaInput = document.getElementById("fecha");
      const reviewsGrid = document.getElementById("reviewsGrid");
      const reviewsStatus = document.getElementById("reviewsStatus");

      fechaInput.value = new Date().toISOString().slice(0, 10);

      function normalizeValue(value) {
        return typeof value === "string" ? value.trim() : (value ?? "");
      }

      function pickField(row, keys) {
        for (const key of keys) {
          const value = row?.[key];
          if (value !== undefined && value !== null && String(value).trim()) {
            return String(value).trim();
          }
        }

        return "";
      }

      function createReviewCard(review) {
        const card = document.createElement("article");
        card.className = "review-card";

        const top = document.createElement("div");
        top.className = "review-top";

        const titleWrap = document.createElement("div");

        const product = document.createElement("h3");
        product.className = "review-product";
        product.textContent = review.producto || "Producto sin nombre";

        const meta = document.createElement("div");
        meta.className = "review-meta";

        if (review.cliente) {
          const cliente = document.createElement("span");
          cliente.textContent = review.cliente;
          meta.appendChild(cliente);
        }

        if (review.fecha) {
          const fecha = document.createElement("span");
          fecha.textContent = review.fecha;
          meta.appendChild(fecha);
        }

        titleWrap.appendChild(product);
        if (meta.childNodes.length > 0) {
          titleWrap.appendChild(meta);
        }

        const badge = document.createElement("span");
        badge.className = "review-badge";
        badge.textContent = review.sentimiento || "Destacada";

        top.appendChild(titleWrap);
        top.appendChild(badge);

        const text = document.createElement("p");
        text.className = "review-text";
        text.textContent = review.resena || "Sin reseña disponible.";

        card.appendChild(top);
        card.appendChild(text);

        return card;
      }

      function renderReviews(reviews) {
        reviewsGrid.replaceChildren();

        if (!reviews.length) {
          const empty = document.createElement("p");
          empty.className = "empty-state";
          empty.textContent = "Todavía no hay reseñas destacadas en esta hoja.";
          reviewsGrid.appendChild(empty);
          return;
        }

        reviews.forEach((review) => {
          reviewsGrid.appendChild(createReviewCard(review));
        });
      }

      async function loadHighlightedReviews() {
        reviewsStatus.textContent = "Actualizando...";

        try {
          const response = await fetch(REVIEWS_ENDPOINT, {
            method: "GET",
            cache: "no-store",
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const data = await response.json();
          const rows = Array.isArray(data.rows)
            ? data.rows
            : Array.isArray(data.data)
              ? data.data
              : Array.isArray(data.reviews)
                ? data.reviews
                : [];

          const reviews = rows.map((row) => ({
            producto: pickField(row, [
              "producto",
              "Producto",
              "item",
              "titulo",
              "title",
            ]),
            cliente: pickField(row, [
              "cliente",
              "Cliente",
              "nombre",
              "Nombre",
              "autor",
            ]),
            resena: pickField(row, [
              "resena",
              "reseña",
              "Reseña",
              "review",
              "comentario",
              "Comentario",
              "text",
              "Texto",
            ]),
            fecha: pickField(row, ["fecha", "Fecha", "date", "Date"]),
            sentimiento: pickField(row, [
              "sentimiento",
              "Sentimiento",
              "estado",
              "Estado",
            ]),
          }));

          renderReviews(reviews);
          reviewsStatus.textContent = `Mostrando ${reviews.length} reseña${reviews.length === 1 ? "" : "s"}.`;
        } catch (error) {
          reviewsGrid.replaceChildren();
          const empty = document.createElement("p");
          empty.className = "empty-state";
          empty.textContent =
            "No se pudieron cargar las reseñas destacadas. Revisa que el doGet devuelva JSON.";
          reviewsGrid.appendChild(empty);
          reviewsStatus.textContent = "Sin conexión a la hoja.";
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        status.textContent = "Enviando...";
        submitBtn.disabled = true;

        const payload = {
          producto: document.getElementById("producto").value.trim(),
          cliente: document.getElementById("cliente").value.trim(),
          resena: document.getElementById("reseña").value.trim(),
          fecha: fechaInput.value,
        };

        const body = JSON.stringify(payload);

        try {
          const queued =
            typeof navigator.sendBeacon === "function" &&
            navigator.sendBeacon(
              SHEET_ENDPOINT,
              new Blob([body], { type: "text/plain;charset=UTF-8" }),
            );

          if (!queued) {
            await fetch(SHEET_ENDPOINT, {
              method: "POST",
              mode: "no-cors",
              headers: {
                "Content-Type": "text/plain;charset=UTF-8",
              },
              body,
            });
          }

          status.textContent = "Datos enviados correctamente.";
          form.reset();
          fechaInput.value = new Date().toISOString().slice(0, 10);
          loadHighlightedReviews();
        } catch (error) {
          status.textContent = "No se pudo enviar la información.";
        } finally {
          submitBtn.disabled = false;
        }
      });

      loadHighlightedReviews();
    </script>
  </body>
</html>
