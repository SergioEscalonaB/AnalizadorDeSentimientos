<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de reseñas</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #eef6ff;
        --card: rgba(255, 255, 255, 0.96);
        --text: #17324d;
        --muted: #5f738a;
        --border: #c7dbf2;
        --accent: #1f6feb;
        --accent-strong: #1557c0;
        --accent-soft: #dcedff;
        --shadow: 0 18px 40px rgba(31, 111, 235, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            circle at top left,
            rgba(31, 111, 235, 0.18),
            transparent 28%
          ),
          radial-gradient(
            circle at bottom right,
            rgba(125, 211, 252, 0.4),
            transparent 30%
          ),
          linear-gradient(135deg, #f9fcff 0%, #e8f2ff 100%);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 40px 18px 20px;
      }

      .card {
        width: min(100%, 500px);
        background: var(--card);
        border: 1px solid rgba(199, 219, 242, 0.9);
        border-radius: 18px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
        padding: 18px;
        margin-top: 14px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.3rem, 3vw, 1.8rem);
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 16px;
        color: var(--muted);
        line-height: 1.5;
        font-size: 0.95rem;
      }

      form {
        display: grid;
        gap: 12px;
      }

      .grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .field {
        display: grid;
        gap: 8px;
      }

      label {
        font-weight: 700;
        font-size: 0.9rem;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 11px 12px;
        font: inherit;
        color: var(--text);
        background: #fff;
        outline: none;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }

      input:focus,
      textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(31, 111, 235, 0.12);
      }

      textarea {
        min-height: 110px;
        resize: vertical;
      }

      .actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      button {
        border: 0;
        border-radius: 12px;
        padding: 10px 14px;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(
          135deg,
          var(--accent),
          var(--accent-strong)
        );
        cursor: pointer;
        box-shadow: 0 10px 20px rgba(31, 111, 235, 0.2);
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          opacity 0.15s ease;
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 12px 24px rgba(31, 111, 235, 0.24);
      }

      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      .status {
        min-height: 1.25rem;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .hint {
        margin-top: 8px;
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--accent-soft);
        color: #164b9d;
        font-size: 0.9rem;
        line-height: 1.45;
        border: 1px solid rgba(31, 111, 235, 0.12);
      }

      @media (max-width: 640px) {
        body {
          padding-top: 22px;
        }

        .card {
          width: min(100%, 100%);
          margin-top: 0;
          padding: 16px;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Formulario de reseñas</h1>
      <p>
        Completa los datos y el formulario enviará la información a tu Google
        Sheet.
      </p>

      <form id="reviewForm">
        <div class="grid">
          <div class="field">
            <label for="producto">Producto</label>
            <input
              id="producto"
              name="producto"
              type="text"
              placeholder="Ej. Audífonos inalámbricos"
              required
            />
          </div>

          <div class="field">
            <label for="cliente">Cliente</label>
            <input
              id="cliente"
              name="cliente"
              type="text"
              placeholder="Ej. Ana Pérez"
              required
            />
          </div>
        </div>

        <div class="field">
          <label for="reseña">Reseña</label>
          <textarea
            id="reseña"
            name="reseña"
            placeholder="Escribe tu opinion..."
            required
          ></textarea>
        </div>

        <div class="grid">
          <div class="field">
            <label for="fecha">Fecha</label>
            <input id="fecha" name="fecha" type="date" required />
          </div>

          <div class="field">
            <label>&nbsp;</label>
            <div class="actions">
              <button id="submitBtn" type="submit">Enviar al Sheet</button>
              <div id="status" class="status"></div>
            </div>
          </div>
        </div>
      </form>
    </main>

    <script>
      const SHEET_ENDPOINT =
        "https://script.google.com/macros/s/AKfycbxwNluxtBZDXTkBElTYeFzemYdMus25J5FsYXjbuEY27XZ05sfxd4KmT6ooY_AAshhbnQ/exec";
      const form = document.getElementById("reviewForm");
      const status = document.getElementById("status");
      const submitBtn = document.getElementById("submitBtn");
      const fechaInput = document.getElementById("fecha");

      fechaInput.value = new Date().toISOString().slice(0, 10);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        status.textContent = "Enviando...";
        submitBtn.disabled = true;

        const payload = {
          producto: document.getElementById("producto").value.trim(),
          cliente: document.getElementById("cliente").value.trim(),
          resena: document.getElementById("reseña").value.trim(),
          fecha: fechaInput.value,
        };

        const body = JSON.stringify(payload);

        try {
          const queued =
            typeof navigator.sendBeacon === "function" &&
            navigator.sendBeacon(
              SHEET_ENDPOINT,
              new Blob([body], { type: "text/plain;charset=UTF-8" }),
            );

          if (!queued) {
            await fetch(SHEET_ENDPOINT, {
              method: "POST",
              mode: "no-cors",
              headers: {
                "Content-Type": "text/plain;charset=UTF-8",
              },
              body,
            });
          }

          status.textContent = "Datos enviados correctamente.";
          form.reset();
          fechaInput.value = new Date().toISOString().slice(0, 10);
        } catch (error) {
          status.textContent = "No se pudo enviar la información.";
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
