<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de reseñas</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4efe8;
        --card: rgba(255, 255, 255, 0.84);
        --text: #1f2937;
        --muted: #6b7280;
        --border: #d6cec3;
        --accent: #0f766e;
        --accent-strong: #115e59;
        --shadow: 0 20px 50px rgba(31, 41, 55, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            circle at top left,
            rgba(15, 118, 110, 0.16),
            transparent 30%
          ),
          radial-gradient(
            circle at bottom right,
            rgba(180, 83, 9, 0.14),
            transparent 28%
          ),
          linear-gradient(135deg, #f7f2eb 0%, #efe7dd 100%);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(100%, 720px);
        background: var(--card);
        border: 1px solid rgba(214, 206, 195, 0.7);
        border-radius: 24px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
        padding: 28px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.6rem, 4vw, 2.4rem);
      }

      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.5;
      }

      form {
        display: grid;
        gap: 16px;
      }

      .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .field {
        display: grid;
        gap: 8px;
      }

      label {
        font-weight: 700;
        font-size: 0.95rem;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px 14px;
        font: inherit;
        color: var(--text);
        background: #fff;
        outline: none;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }

      input:focus,
      textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12);
      }

      textarea {
        min-height: 150px;
        resize: vertical;
      }

      .actions {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(
          135deg,
          var(--accent),
          var(--accent-strong)
        );
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      .status {
        min-height: 1.25rem;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .hint {
        margin-top: 8px;
        padding: 12px 14px;
        border-radius: 14px;
        background: rgba(15, 118, 110, 0.08);
        color: #134e4a;
        font-size: 0.92rem;
        line-height: 1.45;
      }

      @media (max-width: 640px) {
        .card {
          padding: 20px;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Formulario de reseñas</h1>
      <p>
        Completa los datos y el formulario enviará la información a tu Google
        Sheet.
      </p>

      <form id="reviewForm">
        <div class="grid">
          <div class="field">
            <label for="producto">Producto</label>
            <input
              id="producto"
              name="producto"
              type="text"
              placeholder="Ej. Audífonos inalámbricos"
              required
            />
          </div>

          <div class="field">
            <label for="cliente">Cliente</label>
            <input
              id="cliente"
              name="cliente"
              type="text"
              placeholder="Ej. Ana Pérez"
              required
            />
          </div>
        </div>

        <div class="field">
          <label for="reseña">Reseña</label>
          <textarea
            id="reseña"
            name="reseña"
            placeholder="Escribe la opinión del cliente..."
            required
          ></textarea>
        </div>

        <div class="grid">
          <div class="field">
            <label for="fecha">Fecha</label>
            <input id="fecha" name="fecha" type="date" required />
          </div>

          <div class="field">
            <label>&nbsp;</label>
            <div class="actions">
              <button id="submitBtn" type="submit">Enviar al Sheet</button>
              <div id="status" class="status"></div>
            </div>
          </div>
        </div>
      </form>
    </main>

    <script>
      const SHEET_ENDPOINT =
        "https://script.google.com/macros/s/AKfycbxwNluxtBZDXTkBElTYeFzemYdMus25J5FsYXjbuEY27XZ05sfxd4KmT6ooY_AAshhbnQ/exec";
      const form = document.getElementById("reviewForm");
      const status = document.getElementById("status");
      const submitBtn = document.getElementById("submitBtn");
      const fechaInput = document.getElementById("fecha");

      fechaInput.value = new Date().toISOString().slice(0, 10);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        status.textContent = "Enviando...";
        submitBtn.disabled = true;

        const payload = {
          producto: document.getElementById("producto").value.trim(),
          cliente: document.getElementById("cliente").value.trim(),
          resena: document.getElementById("reseña").value.trim(),
          fecha: fechaInput.value,
        };

        const body = JSON.stringify(payload);

        try {
          const queued =
            typeof navigator.sendBeacon === "function" &&
            navigator.sendBeacon(
              SHEET_ENDPOINT,
              new Blob([body], { type: "text/plain;charset=UTF-8" }),
            );

          if (!queued) {
            await fetch(SHEET_ENDPOINT, {
              method: "POST",
              mode: "no-cors",
              headers: {
                "Content-Type": "text/plain;charset=UTF-8",
              },
              body,
            });
          }

          status.textContent = "Datos enviados correctamente.";
          form.reset();
          fechaInput.value = new Date().toISOString().slice(0, 10);
        } catch (error) {
          status.textContent = "No se pudo enviar la información.";
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
